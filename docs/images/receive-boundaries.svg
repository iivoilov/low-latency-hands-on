   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 137.105325)">EPYC 7742 / Intel X550</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 154.18995)">P2: 4/20 Mbps, 5/100 ms</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 171.274575)">3 runs × 125,024 packets</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 188.3592)">p50: 43.2–43.8 µs</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 205.443825)">p99.9: 0.893–1.547 ms</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b45a08" x="295.488" y="297.792" transform="rotate(-0 295.488 297.792)">Application · 16 Nov 2026</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 333.521325)">Ryzen 9 9950X / r8169</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 350.60595)">S1: 8/20 Mbps, 10/100 ms</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 367.690575)">3 runs/build × 1M updates</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 384.7752)">p50: 1.35–1.52 µs</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(295.488 401.859825)">p99.9: 3.57–4.56 µs</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #20313d" x="21.888" y="519.552" transform="rotate(-0 21.888 519.552)">Different hosts, workloads and sample units. Do not add percentiles.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(21.888 557.309559)">RX ranges: three per-run percentiles; PHC read half-width ≤ 2.7855 µs.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(21.888 572.258606)">Application ranges: medians per build (combined variant); ring wait included.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(21.888 587.207653)">Physical-wire calibration and combined NIC-to-L1 latency are unmeasured.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #20313d" transform="translate(21.888 602.1567)">Sources: hardware-rx (12 Nov) and ring-quantity-ryzen (16 Nov) JSON.</text>
